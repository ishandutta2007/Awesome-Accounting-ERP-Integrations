<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>

    <style>
      .glow-pulse {
        animation: pulse 6s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8 8;
        animation: flow 20s linear infinite;
      }
      .node-float {
        animation: float 4s ease-in-out infinite alternate;
      }
      .badge-glow {
        filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4));
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.96); }
        100% { opacity: 0.7; transform: scale(1.04); }
      }
      @keyframes flow {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Animated Glowing Orbs (in background) -->
  <circle cx="200" cy="100" r="180" fill="url(#glowGrad1)" class="glow-pulse" />
  <circle cx="1000" cy="320" r="220" fill="url(#glowGrad2)" class="glow-pulse" style="animation-delay: -3s;" />

  <!-- Dynamic Animated Background Data Flow Lines -->
  <g opacity="0.45">
    <path d="M 100 350 C 300 280, 500 380, 750 320 C 950 260, 1050 360, 1150 310" 
          fill="none" stroke="#38bdf8" stroke-width="2" class="dash-flow" />
    <path d="M 50 80 C 250 160, 480 60, 720 120 C 950 180, 1050 80, 1180 130" 
          fill="none" stroke="#818cf8" stroke-width="1.5" class="dash-flow" style="animation-duration: 25s; animation-direction: reverse;" />
    
    <!-- Floating background data points -->
    <circle cx="320" cy="295" r="4" fill="#38bdf8" />
    <circle cx="750" cy="320" r="4" fill="#818cf8" />
    <circle cx="950" cy="260" r="4" fill="#c084fc" />
    <circle cx="480" cy="60" r="4" fill="#38bdf8" />
    <circle cx="720" cy="120" r="4" fill="#a855f7" />
  </g>

  <!-- Content Group (Foreground - completely legible and prominent) -->
  <g transform="translate(600, 205)" text-anchor="middle">
    <!-- Category Badge -->
    <g transform="translate(0, -115)">
      <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" class="badge-glow" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="2">
        ⚡ AWESOME ENTERPRISE STACK ⚡
      </text>
    </g>

    <!-- Main Title -->
    <text y="-35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="46" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
      Accounting &amp; ERP Integrations
    </text>

    <!-- Subtitle -->
    <text y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="18" font-weight="500" fill="#94a3b8">
      Curated Open-Source Frameworks &amp; Enterprise SaaS Connectors
    </text>

    <!-- Tagline & Feature Pills -->
    <g transform="translate(0, 70)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
      <!-- Pill 1 -->
      <g transform="translate(-360, 0)">
        <rect x="0" y="-14" width="160" height="28" rx="14" fill="#1e293b" stroke="#334155" />
        <text x="80" y="4" fill="#cbd5e1" text-anchor="middle">📊 GL &amp; Ledger Sync</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-180, 0)">
        <rect x="0" y="-14" width="165" height="28" rx="14" fill="#1e293b" stroke="#334155" />
        <text x="82.5" y="4" fill="#cbd5e1" text-anchor="middle">📑 Invoice Automation</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(5, 0)">
        <rect x="0" y="-14" width="175" height="28" rx="14" fill="#1e293b" stroke="#334155" />
        <text x="87.5" y="4" fill="#cbd5e1" text-anchor="middle">🌐 Multi-Entity Sync</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(200, 0)">
        <rect x="0" y="-14" width="160" height="28" rx="14" fill="#1e293b" stroke="#334155" />
        <text x="80" y="4" fill="#cbd5e1" text-anchor="middle">🔓 Open-Source ERPs</text>
      </g>
    </g>
  </g>

  <!-- Border Accent -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
</svg>
